<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Illustration of the DriveLink 15 magnetic wireless car charger mount holding a phone on a vent clip">
  <defs>
    <linearGradient id="puck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5768"/>
      <stop offset="0.55" stop-color="#333e4d"/>
      <stop offset="1" stop-color="#232c38"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="228" rx="120" ry="12" fill="#0f172a" opacity="0.16"/>

  <!-- vent slats behind -->
  <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.35">
    <line x1="118" y1="72"  x2="282" y2="72"/>
    <line x1="118" y1="96"  x2="282" y2="96"/>
    <line x1="118" y1="120" x2="282" y2="120"/>
    <line x1="118" y1="144" x2="282" y2="144"/>
  </g>

  <!-- vent clip arm -->
  <path d="M200 118 h0 a10 10 0 0 1 10 10 v34 h-20 v-34 a10 10 0 0 1 10-10 z" fill="#2b3543"/>
  <path d="M186 150 h28 v10 a6 6 0 0 1 -6 6 h-16 a6 6 0 0 1 -6-6 z" fill="#3d4a5c"/>

  <!-- ball joint -->
  <circle cx="200" cy="120" r="13" fill="#3d4a5c"/>
  <circle cx="200" cy="120" r="5" fill="#1e293b"/>

  <!-- wireless field glow -->
  <circle cx="200" cy="104" r="62" fill="url(#glow)"/>

  <!-- charger puck -->
  <circle cx="200" cy="104" r="44" fill="url(#puck)"/>
  <circle cx="200" cy="104" r="34" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.55"/>
  <circle cx="200" cy="104" r="24" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>

  <!-- magnet ring dots -->
  <g fill="#64748b" opacity="0.8">
    <circle cx="200" cy="74" r="2.4"/>
    <circle cx="221" cy="83" r="2.4"/>
    <circle cx="230" cy="104" r="2.4"/>
    <circle cx="221" cy="125" r="2.4"/>
    <circle cx="200" cy="134" r="2.4"/>
    <circle cx="179" cy="125" r="2.4"/>
    <circle cx="170" cy="104" r="2.4"/>
    <circle cx="179" cy="83" r="2.4"/>
  </g>

  <!-- phone, angled, attached magnetically -->
  <g transform="rotate(-8 200 104)">
    <rect x="158" y="34" width="84" height="150" rx="13" fill="url(#phone)"/>
    <rect x="164" y="40" width="72" height="138" rx="9" fill="url(#screen)"/>
    <rect x="186" y="44" width="28" height="5" rx="2.5" fill="#0f172a"/>
    <!-- charging bolt -->
    <path d="M204 92 l-14 24 h11 l-4 20 15-26 h-11 z" fill="#38bdf8"/>
  </g>

  <!-- USB-C power lead -->
  <path d="M200 166 C 200 196, 262 190, 286 202" fill="none" stroke="#3d4a5c" stroke-width="7" stroke-linecap="round"/>
  <rect x="282" y="194" width="24" height="16" rx="5" fill="#2b3543"/>

  <!-- status LED -->
  <circle cx="200" cy="140" r="3" fill="#22c55e"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="200" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">15W magnetic · N52 magnets · vent + dash</text>
  </g>
</svg>
