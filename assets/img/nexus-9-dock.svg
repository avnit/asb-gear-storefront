<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Illustration of the Nexus 9 USB-C docking station, a slim aluminium bar with nine ports">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6b7f"/>
      <stop offset="0.45" stop-color="#3d4a5c"/>
      <stop offset="1" stop-color="#2b3543"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8ea3"/>
      <stop offset="0.5" stop-color="#9dadc0"/>
      <stop offset="1" stop-color="#6d7e93"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5766"/>
      <stop offset="1" stop-color="#2b3543"/>
    </linearGradient>
  </defs>

  <!-- soft shadow -->
  <ellipse cx="205" cy="212" rx="150" ry="14" fill="#0f172a" opacity="0.16"/>

  <!-- braided cable -->
  <path d="M60 150 C 20 150, 18 196, 62 198" fill="none" stroke="url(#cable)" stroke-width="9" stroke-linecap="round"/>
  <rect x="58" y="188" width="30" height="20" rx="5" fill="#3d4a5c"/>
  <rect x="84" y="193" width="14" height="10" rx="3" fill="#9dadc0"/>

  <!-- dock body -->
  <rect x="70" y="118" width="270" height="46" rx="10" fill="url(#shell)"/>
  <!-- top face -->
  <path d="M70 128 q0-10 10-10 h250 q10 0 10 10 v6 H70 z" fill="url(#top)"/>
  <!-- brand etch -->
  <rect x="188" y="122" width="36" height="4" rx="2" fill="#0ea5e9" opacity="0.85"/>

  <!-- ports along the face -->
  <g fill="#141b26">
    <!-- USB-A x3 -->
    <rect x="88"  y="136" width="26" height="10" rx="2"/>
    <rect x="122" y="136" width="26" height="10" rx="2"/>
    <rect x="156" y="136" width="26" height="10" rx="2"/>
    <!-- HDMI x2 -->
    <rect x="196" y="135" width="30" height="12" rx="3"/>
    <rect x="234" y="135" width="30" height="12" rx="3"/>
    <!-- ethernet -->
    <rect x="272" y="133" width="24" height="16" rx="3"/>
    <!-- USB-C PD -->
    <rect x="304" y="137" width="20" height="8" rx="4"/>
  </g>
  <g fill="#4f9fd4">
    <rect x="91"  y="139" width="20" height="4" rx="1"/>
    <rect x="125" y="139" width="20" height="4" rx="1"/>
    <rect x="159" y="139" width="20" height="4" rx="1"/>
  </g>

  <!-- card slots on the near edge -->
  <rect x="96" y="158" width="42" height="4" rx="2" fill="#141b26" opacity="0.8"/>
  <rect x="146" y="158" width="24" height="4" rx="2" fill="#141b26" opacity="0.8"/>

  <!-- power LED -->
  <circle cx="330" cy="141" r="3.2" fill="#22c55e"/>

  <!-- port count callout -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="205" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">9 ports · 100W PD · dual 4K</text>
  </g>
</svg>
